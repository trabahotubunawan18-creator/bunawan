# ---------- Security headers ----------
Header always set X-Frame-Options "SAMEORIGIN"
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Permissions-Policy "camera=(), microphone=()"
# Start small. After a week or two with no problems, raise to 31536000 (1 year).
Header always set Strict-Transport-Security "max-age=300"

# Content-Security-Policy in REPORT-ONLY mode: the browser lists problems in the Console but blocks nothing.
# When the Console is clean, rename the header to "Content-Security-Policy" to enforce it.
Header always set Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co https://*.tile.openstreetmap.org https://tile.openstreetmap.org https://server.arcgisonline.com https://*.arcgis.com https://unpkg.com; frame-src 'self' https://www.google.com; connect-src 'self' https://*.arcgis.com https://server.arcgisonline.com; object-src 'none'; base-uri 'self'; form-action 'self' https://accounts.google.com; frame-ancestors 'self'"

# ---------- Compression ----------
<IfModule mod_deflate.c>
  AddOutputFilterByType DEFLATE text/html text/css application/javascript image/svg+xml application/json
</IfModule>

# ---------- Browser caching ----------
# CSS is safe to cache for a year because the pages add ?v=<file time> to it.
# JavaScript has no version number yet, so it is only cached for an hour.
<IfModule mod_expires.c>
  ExpiresActive On
  ExpiresByType text/css "access plus 1 year"
  ExpiresByType image/svg+xml "access plus 1 month"
  ExpiresByType image/jpeg "access plus 1 month"
  ExpiresByType image/png "access plus 1 month"
  ExpiresByType image/x-icon "access plus 1 month"
  ExpiresByType application/javascript "access plus 1 hour"
</IfModule>
